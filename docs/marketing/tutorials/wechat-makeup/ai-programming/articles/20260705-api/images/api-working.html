<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:900px;background:#0d1117;font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:20px;}
.browser{background:#1a1a2e;border-radius:12px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4);}
.bar{background:#111827;padding:10px 16px;display:flex;align-items:center;gap:10px;}
.dots{display:flex;gap:6px;}
.dot{width:11px;height:11px;border-radius:50%;}
.url{flex:1;background:#1f2937;border-radius:6px;padding:5px 12px;font-size:12px;color:#60a5fa;font-family:'Courier New',monospace;}
.content{padding:16px 20px;}
.form-area{background:#111827;border-radius:10px;padding:16px;margin-bottom:12px;}
.form-title{font-size:12px;color:#6a7a9a;margin-bottom:12px;letter-spacing:1px;}
.form-row{display:flex;gap:10px;align-items:flex-end;}
.form-group{flex:1;}
.form-label{font-size:11px;color:#8a9ab0;margin-bottom:4px;}
.form-input{background:#1f2937;border:1px solid #2a3a5a;border-radius:6px;padding:8px 10px;font-size:13px;color:#e2e8f0;width:100%;font-family:'PingFang SC',sans-serif;}
.form-select{background:#1f2937;border:1px solid #2a3a5a;border-radius:6px;padding:8px 10px;font-size:13px;color:#e2e8f0;width:100%;}
.btn{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;border:none;padding:9px 18px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:'PingFang SC',sans-serif;white-space:nowrap;}
.conversion{background:rgba(129,140,248,.08);border:1px solid rgba(129,140,248,.2);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
.conv-label{font-size:11px;color:#8a8aaa;flex:0 0 70px;}
.conv-val{font-size:15px;font-weight:700;color:#a5b4fc;}
.conv-rate{font-size:11px;color:#6a6aaa;margin-left:auto;}
.record-added{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:8px;padding:10px 14px;font-size:12px;color:#34d399;display:flex;align-items:center;gap:8px;}
</style>
</head>
<body>
<div class="browser">
  <div class="bar">
    <div class="dots">
      <div class="dot" style="background:#ff5f57;"></div>
      <div class="dot" style="background:#febc2e;"></div>
      <div class="dot" style="background:#28c840;"></div>
    </div>
    <div class="url">accounting-tool.up.railway.app · 已接入汇率 API</div>
  </div>
  <div class="content">
    <div class="form-area">
      <div class="form-title">记一笔账（支持外币自动换算）</div>
      <div class="form-row">
        <div class="form-group" style="flex:0 0 90px;">
          <div class="form-label">币种</div>
          <select class="form-select"><option>🇺🇸 USD</option></select>
        </div>
        <div class="form-group">
          <div class="form-label">金额</div>
          <div class="form-input">100</div>
        </div>
        <div class="form-group">
          <div class="form-label">备注</div>
          <div class="form-input">Airbnb 民宿</div>
        </div>
        <div class="form-group" style="flex:0 0 auto;">
          <div class="form-label">&nbsp;</div>
          <div class="btn">记账 ✓</div>
        </div>
      </div>
    </div>
    <div class="conversion">
      <span class="conv-label">自动换算</span>
      <span class="conv-val">USD 100 → ¥ 723.41</span>
      <span class="conv-rate">汇率 7.2341 · 来自 exchangerate-api · 1小时缓存</span>
    </div>
    <div class="record-added">
      ✅ 已记录：2025-01-06 · 支出 · Airbnb 民宿 · ¥723.41（原始金额 USD 100）
    </div>
  </div>
</div>
</body>
</html>
