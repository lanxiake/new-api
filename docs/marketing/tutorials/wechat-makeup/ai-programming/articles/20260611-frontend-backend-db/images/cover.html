<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:900px;height:500px;background:linear-gradient(135deg,#0a1628 0%,#0d2a44 50%,#0a2030 100%);display:flex;align-items:center;justify-content:center;font-family:'PingFang SC','Microsoft YaHei',sans-serif;position:relative;}
.wrap{display:flex;align-items:center;gap:56px;padding:40px 60px;}
.left{flex:1;}
.eyebrow{font-size:13px;color:#4a8aaa;letter-spacing:2px;margin-bottom:12px;}
.title{font-size:48px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:16px;}
.title em{color:#00d4ff;font-style:normal;}
.sub{font-size:18px;color:#8ab4cc;line-height:1.6;}
.right{flex:0 0 340px;}
.boxes{display:flex;flex-direction:column;gap:12px;}
.box{border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:14px;}
.box-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.box-text .name{font-size:15px;font-weight:700;margin-bottom:2px;}
.box-text .desc{font-size:12px;opacity:.7;}
.arrow{text-align:center;color:#4a7a9a;font-size:18px;margin:2px 0;}
.series{position:absolute;bottom:20px;right:28px;color:#2a4a6a;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="eyebrow">《人人都能用AI写程序》第06篇</div>
    <div class="title">看懂<em>技术地图</em></div>
    <div class="sub">前端、后端、数据库<br>到底是什么？</div>
  </div>
  <div class="right">
    <div class="boxes">
      <div class="box" style="background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.3);">
        <div class="box-icon" style="background:rgba(0,212,255,0.2);">🖥️</div>
        <div class="box-text">
          <div class="name" style="color:#00d4ff;">前端</div>
          <div class="desc" style="color:#8ab4cc;">用户看到的脸面</div>
        </div>
      </div>
      <div class="arrow">↕</div>
      <div class="box" style="background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);">
        <div class="box-icon" style="background:rgba(99,102,241,0.2);">⚙️</div>
        <div class="box-text">
          <div class="name" style="color:#a5b4fc;">后端</div>
          <div class="desc" style="color:#8ab4cc;">处理逻辑的大脑</div>
        </div>
      </div>
      <div class="arrow">↕</div>
      <div class="box" style="background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.3);">
        <div class="box-icon" style="background:rgba(52,211,153,0.2);">🗄️</div>
        <div class="box-text">
          <div class="name" style="color:#6ee7b7;">数据库</div>
          <div class="desc" style="color:#8ab4cc;">永久存储的记忆</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="series">准备篇 第2章</div>
</body>
</html>
