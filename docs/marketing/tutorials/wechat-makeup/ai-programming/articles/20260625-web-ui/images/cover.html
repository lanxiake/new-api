<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:900px;height:500px;background:linear-gradient(135deg,#0a1628 0%,#1a2a1a 50%,#0a1628 100%);display:flex;align-items:center;justify-content:center;font-family:'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;}
.wrap{display:flex;align-items:center;gap:56px;padding:40px 56px;width:100%;}
.left{flex:1;}
.eyebrow{font-size:13px;color:#4a8a6a;letter-spacing:2px;margin-bottom:12px;}
.title{font-size:42px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:16px;}
.title em{color:#4ade80;font-style:normal;}
.sub{font-size:16px;color:#7a9a7a;line-height:1.6;}
.right{flex:0 0 310px;}
.upgrade{display:flex;flex-direction:column;gap:8px;}
.step{display:flex;align-items:center;gap:12px;}
.step-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.step-text{font-size:13px;line-height:1.4;}
.step-title{font-weight:700;margin-bottom:2px;}
.step-desc{opacity:.7;font-size:12px;}
.arrow{text-align:center;color:#2a4a2a;font-size:16px;padding:2px 0;}
.result-tag{margin-top:12px;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.25);border-radius:8px;padding:8px 14px;font-size:12px;color:#86efac;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="eyebrow">《人人都能用AI写程序》第10篇</div>
    <div class="title">命令行<br>升级成<em>网页</em></div>
    <div class="sub">加上前端界面<br>手机电脑都能用</div>
  </div>
  <div class="right">
    <div class="upgrade">
      <div class="step">
        <div class="step-icon" style="background:rgba(96,165,250,.15);">🖥️</div>
        <div class="step-text">
          <div class="step-title" style="color:#93c5fd;">命令行版</div>
          <div class="step-desc" style="color:#6a8aaa;">accounting.py — 纯文字菜单</div>
        </div>
      </div>
      <div class="arrow">↓ Flask + HTML</div>
      <div class="step">
        <div class="step-icon" style="background:rgba(74,222,128,.15);">🌐</div>
        <div class="step-text">
          <div class="step-title" style="color:#86efac;">网页版</div>
          <div class="step-desc" style="color:#6a8a6a;">浏览器打开，手机可用</div>
        </div>
      </div>
    </div>
    <div class="result-tag">同样的数据文件，两个界面都能用</div>
  </div>
</div>
</body>
</html>
