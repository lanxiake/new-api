<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:900px;background:#0d1117;font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:20px;}
.browser{background:#1a1a2e;border-radius:12px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4);}
.bar{background:#111827;padding:10px 16px;display:flex;align-items:center;gap:10px;}
.dots{display:flex;gap:6px;}
.dot{width:11px;height:11px;border-radius:50%;}
.url{flex:1;background:#1f2937;border-radius:6px;padding:5px 12px;font-size:12px;color:#60a5fa;font-family:'Courier New',monospace;}
.content{padding:16px 20px;}
.nlp-box{background:#111827;border-radius:10px;padding:16px;margin-bottom:12px;}
.nlp-label{font-size:11px;color:#6a7a9a;margin-bottom:10px;letter-spacing:1px;}
.nlp-input{background:#1f2937;border:1px solid #3a4a6a;border-radius:8px;padding:10px 14px;font-size:14px;color:#e2e8f0;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.nlp-text{color:#c0d0f0;}
.nlp-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;}
.parse-result{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:12px 14px;}
.parse-title{font-size:11px;color:#f59e0b;margin-bottom:8px;letter-spacing:1px;}
.parse-fields{display:flex;gap:10px;}
.parse-field{flex:1;background:#1a1a2e;border-radius:6px;padding:8px 10px;text-align:center;}
.pf-label{font-size:10px;color:#6a7a9a;margin-bottom:3px;}
.pf-val{font-size:14px;font-weight:700;color:#fbbf24;}
.confirm-btn{margin-top:10px;background:linear-gradient(135deg,#059669,#047857);color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;}
</style>
</head>
<body>
<div class="browser">
  <div class="bar">
    <div class="dots">
      <div class="dot" style="background:#ff5f57;"></div>
      <div class="dot" style="background:#febc2e;"></div>
      <div class="dot" style="background:#28c840;"></div>
    </div>
    <div class="url">accounting-tool.up.railway.app · AI 自然语言记账</div>
  </div>
  <div class="content">
    <div class="nlp-box">
      <div class="nlp-label">自然语言输入（说人话就行）</div>
      <div class="nlp-input">
        <span class="nlp-text">上周收到客户转账三千二</span>
        <span class="nlp-btn">AI 解析 →</span>
      </div>
      <div class="parse-result">
        <div class="parse-title">✨ AI 解析结果（请确认）</div>
        <div class="parse-fields">
          <div class="parse-field">
            <div class="pf-label">金额</div>
            <div class="pf-val">¥3,200</div>
          </div>
          <div class="parse-field">
            <div class="pf-label">类型</div>
            <div class="pf-val" style="color:#34d399;">收入</div>
          </div>
          <div class="parse-field">
            <div class="pf-label">备注</div>
            <div class="pf-val" style="font-size:12px;color:#a0b4c8;">客户转账</div>
          </div>
          <div class="parse-field">
            <div class="pf-label">日期</div>
            <div class="pf-val" style="font-size:12px;color:#a0b4c8;">2025-01-01</div>
          </div>
        </div>
        <div class="confirm-btn">确认记录</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
