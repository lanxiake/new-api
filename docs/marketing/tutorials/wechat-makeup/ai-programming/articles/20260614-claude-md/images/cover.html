<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:900px;height:500px;background:linear-gradient(135deg,#0a1628 0%,#1a1040 50%,#0a1628 100%);display:flex;align-items:center;justify-content:center;font-family:'PingFang SC','Microsoft YaHei',sans-serif;position:relative;}
.wrap{display:flex;align-items:center;gap:60px;padding:40px 60px;}
.left{flex:1;}
.eyebrow{font-size:13px;color:#4a8aaa;letter-spacing:2px;margin-bottom:12px;}
.title{font-size:46px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:16px;}
.title em{color:#a78bfa;font-style:normal;}
.sub{font-size:17px;color:#8a9abf;line-height:1.6;}
.right{flex:0 0 320px;}
.book{background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.3);border-radius:16px;padding:24px;}
.book-title{font-size:14px;font-weight:700;color:#a78bfa;margin-bottom:16px;letter-spacing:1px;}
.book-item{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:#c4b5fd;}
.book-num{width:22px;height:22px;border-radius:50%;background:rgba(167,139,250,0.2);border:1px solid rgba(167,139,250,0.4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.tag{display:inline-block;background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.2);color:#a78bfa;padding:4px 12px;border-radius:20px;font-size:11px;margin-top:16px;letter-spacing:1px;}
.series{position:absolute;bottom:20px;right:28px;color:#2a3a5a;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="eyebrow">《人人都能用AI写程序》第07篇</div>
    <div class="title">给 AI 一份<br><em>工作手册</em></div>
    <div class="sub">CLAUDE.md 怎么写<br>让 AI 永远记住你的项目规则</div>
  </div>
  <div class="right">
    <div class="book">
      <div class="book-title">📋 CLAUDE.md 写三件事</div>
      <div class="book-item"><div class="book-num">1</div>这是什么项目</div>
      <div class="book-item"><div class="book-num">2</div>用什么技术栈</div>
      <div class="book-item"><div class="book-num">3</div>有什么规矩</div>
      <div class="tag">放在项目根目录 · 每次自动读取</div>
    </div>
  </div>
</div>
<div class="series">准备篇 第2章</div>
</body>
</html>
