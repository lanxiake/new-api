<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:900px;background:#f4f6fa;font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:40px 52px;}
.title{text-align:center;font-size:20px;font-weight:800;color:#1a2744;margin-bottom:6px;}
.sub{text-align:center;font-size:13px;color:#8a96b0;margin-bottom:30px;}
.cols{display:flex;gap:20px;align-items:stretch;}
.col{flex:1;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.08);}
.col-head{padding:16px 20px;text-align:center;}
.col-icon{font-size:28px;margin-bottom:8px;}
.col-name{font-size:16px;font-weight:800;color:#fff;margin-bottom:4px;}
.col-tag{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600;display:inline-block;}
.col-body{padding:16px 20px;}
.row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:12px;color:#475569;line-height:1.5;}
.row:last-child{border:none;}
.row-label{font-weight:700;color:#334155;flex:0 0 64px;font-size:11px;margin-top:1px;}
.verdict{margin-top:12px;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;text-align:center;}
</style>
</head>
<body>
<div class="title">数据库 vs 文件存储</div>
<div class="sub">为什么云端应用必须用数据库</div>
<div class="cols">
  <div class="col">
    <div class="col-head" style="background:linear-gradient(135deg,#ef4444,#dc2626);">
      <div class="col-icon">📄</div>
      <div class="col-name">JSON 文件</div>
      <div class="col-tag" style="background:rgba(255,255,255,.2);color:#fff;">不推荐 · 有缺陷</div>
    </div>
    <div class="col-body">
      <div class="row"><span class="row-label">并发写</span>多人同时写会冲突，数据可能损坏</div>
      <div class="row"><span class="row-label">数据量</span>超过 1 万条开始明显变慢</div>
      <div class="row"><span class="row-label">查询</span>按条件筛选需要自己写循环代码</div>
      <div class="row"><span class="row-label">云端</span>重新部署后文件消失，数据丢失</div>
      <div class="row"><span class="row-label">备份</span>手动复制文件，容易出错</div>
    </div>
    <div class="verdict" style="background:#fef2f2;color:#ef4444;">适合：本地原型 · 数据量极小</div>
  </div>
  <div class="col">
    <div class="col-head" style="background:linear-gradient(135deg,#059669,#047857);">
      <div class="col-icon">🗃️</div>
      <div class="col-name">SQLite 数据库</div>
      <div class="col-tag" style="background:rgba(255,255,255,.2);color:#fff;">推荐 · 入门首选</div>
    </div>
    <div class="col-body">
      <div class="row"><span class="row-label">并发写</span>内置锁机制，安全处理并发请求</div>
      <div class="row"><span class="row-label">数据量</span>百万行仍然快速，几乎无上限</div>
      <div class="row"><span class="row-label">查询</span>SQL 一行搞定复杂查询和统计</div>
      <div class="row"><span class="row-label">云端</span>挂载持久化卷，重启后数据保留</div>
      <div class="row"><span class="row-label">备份</span>复制 .db 文件即完整备份</div>
    </div>
    <div class="verdict" style="background:#f0fdf4;color:#059669;">适合：个人/小团队应用 · 生产环境</div>
  </div>
</div>
</body>
</html>
