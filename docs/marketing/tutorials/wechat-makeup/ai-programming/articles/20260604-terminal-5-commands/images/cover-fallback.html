<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:900px;height:500px;background:linear-gradient(135deg,#0a1628 0%,#0d2144 60%,#0a2a3a 100%);display:flex;align-items:center;justify-content:center;font-family:'PingFang SC','Microsoft YaHei',monospace;}
.wrap{display:flex;align-items:center;gap:60px;padding:40px;}
.left{flex:1;}
.title{font-size:52px;font-weight:900;color:#fff;line-height:1.2;letter-spacing:2px;margin-bottom:16px;}
.title span{color:#00d4ff;}
.sub{font-size:22px;color:#8ab4d4;letter-spacing:1px;margin-bottom:32px;}
.tags{display:flex;gap:12px;flex-wrap:wrap;}
.tag{background:rgba(0,212,255,0.15);border:1px solid #00d4ff;color:#00d4ff;padding:6px 16px;border-radius:20px;font-size:14px;font-family:monospace;letter-spacing:1px;}
.right{flex:0 0 320px;}
.terminal{background:#0d1117;border:2px solid #00d4ff;border-radius:12px;padding:20px 24px;box-shadow:0 0 40px rgba(0,212,255,0.3);}
.term-header{display:flex;gap:8px;margin-bottom:16px;}
.dot{width:12px;height:12px;border-radius:50%;}
.cmd{font-family:'Courier New',monospace;font-size:15px;line-height:2;color:#39ff14;}
.cmd .prompt{color:#00d4ff;}
.series{position:absolute;bottom:24px;right:32px;color:#4a6a8a;font-size:13px;}
</style>
</head>
<body style="position:relative;">
<div class="wrap">
  <div class="left">
    <div class="title">终端<span>不可怕</span></div>
    <div class="sub">你只需要会这 5 条命令</div>
    <div class="tags">
      <span class="tag">pwd</span>
      <span class="tag">ls</span>
      <span class="tag">cd</span>
      <span class="tag">mkdir</span>
      <span class="tag">python</span>
    </div>
  </div>
  <div class="right">
    <div class="terminal">
      <div class="term-header">
        <div class="dot" style="background:#ff5f57;"></div>
        <div class="dot" style="background:#febc2e;"></div>
        <div class="dot" style="background:#28c840;"></div>
      </div>
      <div class="cmd"><span class="prompt">$ </span>pwd</div>
      <div class="cmd"><span class="prompt">$ </span>ls</div>
      <div class="cmd"><span class="prompt">$ </span>cd ai-practice</div>
      <div class="cmd"><span class="prompt">$ </span>mkdir project</div>
      <div class="cmd"><span class="prompt">$ </span>python hello.py<span style="animation:blink 1s infinite;">▌</span></div>
    </div>
  </div>
</div>
<div class="series">《人人都能用AI写程序》第05篇</div>
</body>
</html>
