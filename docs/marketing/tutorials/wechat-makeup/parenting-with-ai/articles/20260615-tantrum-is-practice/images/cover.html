<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 900px; height: 500px;
  background: linear-gradient(135deg, #fef4e8 0%, #fde0c0 60%, #fcd0a0 100%);
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  display: flex; align-items: center; overflow: hidden; position: relative;
}
.deco-circle { position: absolute; border-radius: 50%; opacity: 0.18; }
.c1 { width: 300px; height: 300px; background: #f0a050; top: -70px; right: -40px; }
.c2 { width: 150px; height: 150px; background: #f0c080; bottom: -30px; left: 90px; }
.left { flex: 1; padding: 50px 40px 50px 60px; }
.series-tag { display: inline-block; background: #d4783a; color: white; font-size: 13px; padding: 4px 14px; border-radius: 20px; margin-bottom: 20px; letter-spacing: 1px; }
.main-title { font-size: 30px; font-weight: 900; color: #2a1800; line-height: 1.4; margin-bottom: 22px; }
.main-title span { color: #d4783a; }
.subtitle { font-size: 15px; color: #6a4020; line-height: 1.7; margin-bottom: 28px; }
.points { display: flex; flex-direction: column; gap: 8px; }
.point { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #3a2010; }
.point-dot { width: 8px; height: 8px; background: #d4783a; border-radius: 50%; flex-shrink: 0; }
.right { width: 280px; padding: 40px 40px 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 1; }
.card { background: white; border-radius: 20px; padding: 28px 24px; box-shadow: 0 8px 32px rgba(212,120,58,0.18); text-align: center; width: 100%; }
.card-icon { width: 56px; height: 56px; margin: 0 auto 14px; }
.card-text { font-size: 14px; color: #6a4020; line-height: 1.7; }
.card-number { margin-top: 16px; font-size: 13px; color: #d4783a; font-weight: bold; }
.account { position: absolute; bottom: 24px; right: 40px; font-size: 12px; color: #8a6040; z-index: 2; }
</style>
</head>
<body>
<div class="deco-circle c1"></div>
<div class="deco-circle c2"></div>
<div class="left">
  <div class="series-tag">教育是一场对自己的救赎 · 第03篇</div>
  <div class="main-title">孩子发脾气<br>其实是在<span>练习</span><br>一项重要能力</div>
  <div class="subtitle">哭闹不是问题，是信号</div>
  <div class="points">
    <div class="point"><div class="point-dot"></div><span>发脾气背后，大脑在做什么</span></div>
    <div class="point"><div class="point-dot"></div><span>"忍住不哭"培养不出情绪稳定</span></div>
    <div class="point"><div class="point-dot"></div><span>5分钟情绪命名游戏，当天就能玩</span></div>
  </div>
</div>
<div class="right">
  <div class="card">
    <div class="card-icon">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <!-- 云朵+雨滴 表示情绪如天气 -->
        <path d="M18 30c0-5 4-9 9-9 1.8 0 3.5.5 4.9 1.4C33.5 20.5 36 18 39 18c4.4 0 8 3.6 8 8 0 4.4-3.6 8-8 8H18c-3.3 0-6-2.7-6-6z" stroke="#d4783a" stroke-width="2" fill="none"/>
        <line x1="22" y1="38" x2="20" y2="44" stroke="#4a90d4" stroke-width="2" stroke-linecap="round"/>
        <line x1="28" y1="38" x2="26" y2="44" stroke="#4a90d4" stroke-width="2" stroke-linecap="round"/>
        <line x1="34" y1="38" x2="32" y2="44" stroke="#4a90d4" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="card-text">情绪是天气<br>不需要"修好"<br>只需要陪着走过</div>
    <div class="card-number">不懂技术的技术号</div>
  </div>
</div>
<div class="account">不懂技术的技术号</div>
</body>
</html>
