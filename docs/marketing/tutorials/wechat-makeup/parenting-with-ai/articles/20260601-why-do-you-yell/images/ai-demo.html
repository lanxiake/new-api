<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 900px;
  background: #fffbf5;
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  padding: 40px 60px;
}

.card-title {
  text-align: center;
  font-size: 15px;
  color: #9a7a60;
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.card-title strong { color: #e8734a; }

.main-title {
  text-align: center;
  font-size: 20px;
  font-weight: 900;
  color: #2d1a0e;
  margin-bottom: 30px;
}

.prompt-card {
  background: white;
  border: 2px dashed #f0c080;
  border-radius: 20px;
  padding: 32px 36px;
  position: relative;
}

.prompt-card::before {
  content: "可直接复制粘贴给 AI";
  position: absolute;
  top: -13px;
  left: 50%;
  transform: translateX(-50%);
  background: #e8734a;
  color: white;
  font-size: 12px;
  padding: 3px 16px;
  border-radius: 12px;
  white-space: nowrap;
}

.prompt-text {
  font-size: 14px;
  color: #4a3020;
  line-height: 2;
  white-space: pre-line;
}

.prompt-text .highlight {
  background: #fff0e0;
  padding: 2px 6px;
  border-radius: 4px;
  color: #c0533a;
  font-weight: bold;
}

.tips-row {
  display: flex;
  gap: 16px;
  margin-top: 24px;
}

.tip-item {
  flex: 1;
  background: white;
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  text-align: center;
}

.tip-icon {
  width: 36px;
  height: 36px;
  margin: 0 auto 10px;
  background: #fff5ec;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tip-item .tip-text { font-size: 13px; color: #5a4030; line-height: 1.6; }
.tip-item .tip-text strong { display: block; font-size: 14px; color: #2d1a0e; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="card-title">本篇 <strong>AI 提示词</strong> 卡片</div>
<div class="main-title">让 AI 帮你看见两种截然不同的自己</div>

<div class="prompt-card">
  <div class="prompt-text">我是一个有一个<span class="highlight">5岁</span>孩子的家长。孩子今早不肯好好穿鞋，我催了四遍，最后吼了他，他哭了，我也很难受。

请帮我模拟<span class="highlight">两段对话</span>：
第一段：我吼他的真实经过（从我催第四遍开始，到他哭、我沉默离开，用第一人称，100字左右）
第二段：如果我蹲下来，用平静的声音处理同样的场景，孩子可能的反应是什么（同样100字，口语化，真实）

我想通过对比，看看自己的情绪对孩子的影响。</div>
</div>

<div class="tips-row">
  <div class="tip-item">
    <div class="tip-icon">
      <!-- 编辑/替换图标 -->
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M3 15l3-1 8-8-2-2-8 8-1 3z" stroke="#e8734a" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M11 4l2 2" stroke="#e8734a" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="tip-text"><strong>替换孩子年龄</strong>把"5岁"改成你孩子的实际年龄</div>
  </div>
  <div class="tip-item">
    <div class="tip-icon">
      <!-- 场景/切换图标 -->
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <rect x="2" y="4" width="14" height="10" rx="2" stroke="#e8734a" stroke-width="1.5"/>
        <path d="M6 9h6M9 6v6" stroke="#e8734a" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="tip-text"><strong>换成你的场景</strong>把"穿鞋"换成最近让你崩溃的那件事</div>
  </div>
  <div class="tip-item">
    <div class="tip-icon">
      <!-- 镜子/反思图标 -->
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <ellipse cx="9" cy="8" rx="4" ry="5" stroke="#e8734a" stroke-width="1.5"/>
        <path d="M6 14h6M9 13v3" stroke="#e8734a" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="tip-text"><strong>看完坐一会儿</strong>不用马上行动，先让镜子照着自己</div>
  </div>
</div>

</body>
</html>
