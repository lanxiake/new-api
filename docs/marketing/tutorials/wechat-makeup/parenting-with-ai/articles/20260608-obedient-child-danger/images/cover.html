<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 900px; height: 500px;
  background: linear-gradient(135deg, #f0f7ee 0%, #d4edd0 60%, #b8ddb4 100%);
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  display: flex; align-items: center; overflow: hidden; position: relative;
}
.deco-circle { position: absolute; border-radius: 50%; opacity: 0.18; }
.c1 { width: 300px; height: 300px; background: #4caf7d; top: -80px; right: -50px; }
.c2 { width: 160px; height: 160px; background: #80c878; bottom: -30px; left: 80px; }
.left { flex: 1; padding: 50px 40px 50px 60px; }
.series-tag {
  display: inline-block; background: #3d9b5c; color: white;
  font-size: 13px; padding: 4px 14px; border-radius: 20px;
  margin-bottom: 20px; letter-spacing: 1px;
}
.main-title { font-size: 32px; font-weight: 900; color: #1a3a20; line-height: 1.35; margin-bottom: 22px; }
.main-title span { color: #3d9b5c; }
.subtitle { font-size: 15px; color: #4a7050; line-height: 1.7; margin-bottom: 28px; }
.points { display: flex; flex-direction: column; gap: 8px; }
.point { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #2a4a30; }
.point-dot { width: 8px; height: 8px; background: #3d9b5c; border-radius: 50%; flex-shrink: 0; }
.right { width: 280px; padding: 40px 40px 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 1; }
.card { background: white; border-radius: 20px; padding: 28px 24px; box-shadow: 0 8px 32px rgba(61,155,92,0.18); text-align: center; width: 100%; }
.card-icon { width: 56px; height: 56px; margin: 0 auto 14px; }
.card-text { font-size: 14px; color: #4a7050; line-height: 1.7; }
.card-number { margin-top: 16px; font-size: 13px; color: #3d9b5c; font-weight: bold; }
.account { position: absolute; bottom: 24px; right: 40px; font-size: 12px; color: #6a9070; z-index: 2; }
</style>
</head>
<body>
<div class="deco-circle c1"></div>
<div class="deco-circle c2"></div>
<div class="left">
  <div class="series-tag">教育是一场对自己的救赎 · 第02篇</div>
  <div class="main-title">越<span>听话</span>的孩子<br>长大越<span>危险</span></div>
  <div class="subtitle">乖，是保护了你<br>还是关住了他？</div>
  <div class="points">
    <div class="point"><div class="point-dot"></div><span>"乖"背后藏着什么代价</span></div>
    <div class="point"><div class="point-dot"></div><span>顺从感 vs 规则感，区别在哪</span></div>
    <div class="point"><div class="point-dot"></div><span>保护孩子说"不"的能力</span></div>
  </div>
</div>
<div class="right">
  <div class="card">
    <div class="card-icon">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <!-- 小人被围栏围住的图标 -->
        <circle cx="28" cy="18" r="7" stroke="#3d9b5c" stroke-width="2.5"/>
        <path d="M18 42c0-5.5 4.5-10 10-10s10 4.5 10 10" stroke="#3d9b5c" stroke-width="2.5" stroke-linecap="round"/>
        <!-- 围栏 -->
        <line x1="10" y1="30" x2="10" y2="50" stroke="#e8a050" stroke-width="2" stroke-linecap="round"/>
        <line x1="46" y1="30" x2="46" y2="50" stroke="#e8a050" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="36" x2="48" y2="36" stroke="#e8a050" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="44" x2="48" y2="44" stroke="#e8a050" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="card-text">乖，是他学会了<br>压住自己的声音</div>
    <div class="card-number">不懂技术的技术号</div>
  </div>
</div>
<div class="account">不懂技术的技术号</div>
</body>
</html>
