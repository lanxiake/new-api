<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 900px; background: #f5f8f5; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; padding: 48px 60px; }
.title { text-align: center; font-size: 22px; font-weight: 900; color: #1a3a20; margin-bottom: 8px; }
.title span { color: #3d9b5c; }
.subtitle { text-align: center; font-size: 14px; color: #6a8a70; margin-bottom: 36px; }
.row { display: flex; gap: 20px; margin-bottom: 20px; }
.box { flex: 1; background: white; border-radius: 16px; padding: 26px 22px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.box-label { font-size: 12px; font-weight: bold; letter-spacing: 2px; margin-bottom: 14px; padding: 4px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; }
.box-label.bad { background: #ffeee8; color: #c0533a; }
.box-label.good { background: #edfaf2; color: #2d8a52; }
.box-title { font-size: 17px; font-weight: bold; margin-bottom: 12px; line-height: 1.4; }
.box.bad-box .box-title { color: #c0533a; }
.box.good-box .box-title { color: #2d8a52; }
.box-body { font-size: 14px; color: #4a5a50; line-height: 1.8; }
.arrow { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 36px; }
.examples { display: flex; gap: 16px; }
.ex { flex: 1; background: white; border-radius: 14px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.ex-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.ex-icon.warn { background: #ffeee8; }
.ex-icon.ok { background: #edfaf2; }
.ex-title { font-size: 13px; font-weight: bold; color: #2d1a0e; margin-bottom: 6px; }
.ex-body { font-size: 13px; color: #5a6a60; line-height: 1.7; }
</style>
</head>
<body>
<div class="title">"乖"有两种<br>外表一样，<span>内核截然不同</span></div>
<div class="subtitle">顺从感和规则感，是完全不同的两件事</div>
<div class="row">
  <div class="box bad-box">
    <div class="box-label bad">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><line x1="2" y1="2" x2="10" y2="10" stroke="#c0533a" stroke-width="2" stroke-linecap="round"/><line x1="10" y1="2" x2="2" y2="10" stroke="#c0533a" stroke-width="2" stroke-linecap="round"/></svg>
      顺从感
    </div>
    <div class="box-title">因为害怕失去爱<br>所以听话</div>
    <div class="box-body">不明白为什么，只知道不顺从会有麻烦。把"不让大人失望"当成第一优先级，自己的感受和判断排在后面。</div>
  </div>
  <div class="arrow">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M14 7l5 5-5 5" stroke="#e8734a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="box good-box">
    <div class="box-label good">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="#2d8a52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      规则感
    </div>
    <div class="box-title">因为内心认同<br>所以配合</div>
    <div class="box-body">理解"为什么不能这样做"，发自内心同意这个边界。遇到不合理的要求时，知道自己可以、也应该说"不"。</div>
  </div>
</div>
<div class="examples">
  <div class="ex">
    <div class="ex-icon warn">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3L2 15h14L9 3z" stroke="#c0533a" stroke-width="1.5" stroke-linejoin="round"/><line x1="9" y1="8" x2="9" y2="11" stroke="#c0533a" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="13" r="0.8" fill="#c0533a"/></svg>
    </div>
    <div class="ex-title">顺从感的风险</div>
    <div class="ex-body">陌生人说"跟我走有糖吃"，他可能跟着走——因为他不知道拒绝大人是被允许的</div>
  </div>
  <div class="ex">
    <div class="ex-icon ok">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6" stroke="#2d8a52" stroke-width="1.5"/><polyline points="6,9 8,11 12,7" stroke="#2d8a52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="ex-title">规则感的力量</div>
    <div class="ex-body">遇到不合理要求时，内心有一把尺——他知道这不对，能说出"我不要"</div>
  </div>
  <div class="ex">
    <div class="ex-icon ok">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 9l3 3 5-5" stroke="#2d8a52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="9" r="7" stroke="#2d8a52" stroke-width="1.5"/></svg>
    </div>
    <div class="ex-title">怎么培养规则感</div>
    <div class="ex-body">说"不行"的时候，加一句"因为……"。让孩子理解规则，而不只是执行命令</div>
  </div>
</div>
</body>
</html>
